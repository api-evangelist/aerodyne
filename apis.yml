aid: aerodyne
name: Aerodyne
description: >-
  Aerodyne Group is a Malaysia-headquartered DT3 (drone technology, data technology, and digital
  transformation) enterprise solutions provider, founded in 2014. Through its Drone-as-a-Service
  (DaaS) model and the AI-powered, cloud-based vertikaliti asset-management platform, Aerodyne turns
  aerial and sensor data into deep analytics and actionable insights for infrastructure, power line,
  wind turbine, solar, and agricultural (Agrimor) asset inspection and management. Operating across
  45 countries with a global network of AeroRangers, it was ranked the world's number-one drone
  service provider by Drone Industry Insights in 2021 and 2022. Aerodyne is a 500 Global portfolio
  company. No public developer portal, API, or machine-readable specification has been identified at
  this time.
